# ============================================================================================
# aaPanel → Website → movexa.lan → Config file   (replace the whole server block with this one)
# Single public address: https://movexa.lan:8088  — NOT served on 80 or 443.
# After changing the SSL certificate or the port in the Panel, re-check the lines marked [8088].
# ============================================================================================
server
{
    # [8088] HTTPS directly on 8088. nginx >= 1.25.1: use "listen 8088 ssl;" + "http2 on;" instead.
    listen 8088 ssl http2;
    # listen [::]:8088 ssl http2;   # uncomment if the LAN uses IPv6
    server_name movexa.lan;
    index index.php index.html;
    root /www/wwwroot/movexa.lan/public;

    #SSL-START
    # [8088] Plain HTTP sent to this TLS port → redirect to https keeping the port.
    error_page 497 https://$host:$server_port$request_uri;
    ssl_certificate    /www/server/panel/vhost/cert/movexa.lan/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/movexa.lan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_movexa:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    #SSL-END

    client_max_body_size 16m;            # chunked upload: 8 MB chunks
    add_header X-Content-Type-Options nosniff always;

    #PHP-INFO-START
    include enable-php-83.conf;
    #PHP-INFO-END

    #REWRITE-START
    location / { try_files $uri $uri/ /index.php?$query_string; }
    #REWRITE-END

    # Protected media: reachable ONLY via X-Accel-Redirect after Laravel checked session + signed token + access policy.
    location /_protected/ {
        internal;
        alias /www/data/movexa/;
        types { video/mp4 mp4 m4v; video/iso.segment m4s; application/vnd.apple.mpegurl m3u8; video/mp2t ts; text/vtt vtt; image/webp webp; image/jpeg jpg; video/x-matroska mkv; video/webm webm; application/json json; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private" always;
        sendfile on;
        tcp_nopush on;
    }
    location /_cloudsync/ {
        internal;
        alias /www/data/cloudsync/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Reverb WebSocket on the same public port (wss://movexa.lan:8088/app/...).
    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8080;
    }

    # Never serve dotfiles (.env, .git, …).
    location ~ /\.(?!well-known) { deny all; return 404; }

    location ~* ^/(build|icons)/.*\.(js|css|woff2|png|svg|webp)$ {
        expires 30d;
        access_log off;
    }
    access_log  /www/wwwlogs/movexa.lan.log;
    error_log  /www/wwwlogs/movexa.lan.error.log;
}
