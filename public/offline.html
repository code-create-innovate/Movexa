<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>Movexa · بدون اتصال</title>
<link rel="icon" href="/icons/icon.svg">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #14060a, #0b0b0f 50%, #0b0b1a); color: #f4f4f5; min-height: 100vh; }
  header { padding: 16px; display: flex; gap: 12px; align-items: center; }
  h1 { color: #e50914; margin: 0; font-size: 22px; }
  main { padding: 0 16px 32px; max-width: 900px; margin: 0 auto; }
  .item { display: flex; gap: 12px; align-items: center; background: #16161c; border: 1px solid #27272f; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .item img { width: 48px; height: 72px; object-fit: cover; border-radius: 6px; background: #222; }
  .item .t { flex: 1; }
  button { background: #e50914; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  video { width: 100%; max-height: 70vh; background: #000; border-radius: 10px; }
  video::cue { background: rgb(0 0 0 / .6); unicode-bidi: plaintext; }
  .muted { color: #a1a1aa; font-size: 13px; }
</style>
</head>
<body>
<header><h1>Movexa</h1><span class="muted">بدون اتصال · Offline</span><a href="/downloads" style="margin-inline-start:auto;color:#a1a1aa">التنزيلات</a></header>
<main>
  <div id="player" hidden><video id="v" controls playsinline></video><p id="now" class="muted"></p></div>
  <div id="list"></div>
  <p class="muted">النسخ المحفوظة تعمل دون اتصال حتى تاريخ انتهائها. عند الاتصال بالخادم تُجدَّد أو تُحذف إذا سُحبت الصلاحية.</p>
</main>
<script src="/offline.js"></script>
</body>
</html>
